<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'none'; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <title>Jot</title>
  <link rel="icon" href="assets/jot.svg">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="workspace.css">
</head>
<body>
  <main id="app" class="app" aria-label="Jot">
    <header id="handle" class="handle">
      <div class="window-actions">
        <button id="notesButton" class="icon-button" data-icon="notepad-text" aria-label="Home (Ctrl+K)" title="Home · Ctrl+K"></button>
        <button id="closeAppButton" class="icon-button" data-icon="power" aria-label="Quit Jot" title="Save notes and quit Jot"></button>
        <button id="hideButton" class="icon-button" data-icon="minus" aria-label="Hide (Esc)" title="Hide · Esc"></button>
        <button id="newButton" class="icon-button" data-icon="plus" aria-label="New note (Ctrl+N)" title="New note · Ctrl+N"></button>
        <button id="pinButton" class="icon-button" data-icon="pin" aria-label="Keep on top" title="Keep on top" aria-pressed="false"></button>
      </div>
      <span class="drag-grip" aria-hidden="true"></span>
    </header>
    <div id="writingArea" class="writing-area">
      <div id="editor" class="editor" role="textbox" aria-label="Note text · Persian and English" aria-multiline="true" contenteditable="true" dir="auto" spellcheck="false" data-empty="true"><p dir="auto"><br></p></div>
    </div>
    <footer class="quiet-footer">
      <div class="footer-actions">
        <button id="formatButton" class="icon-button" data-icon="type" aria-label="Text formatting (Ctrl+Shift+F)" title="Formatting · Ctrl+Shift+F" aria-expanded="false"></button>
        <button id="imageButton" class="icon-button" data-icon="image-plus" aria-label="Insert image" title="Insert image · or paste with Ctrl+V"></button>
        <button id="menuButton" class="icon-button" data-icon="ellipsis" aria-label="Settings" title="Settings" aria-expanded="false"></button>
      </div>
    </footer>
    <div id="formatBar" class="format-bar surface" role="toolbar" aria-label="Text formatting" hidden>
      <button id="blockMenuButton" class="format-picker" aria-label="Paragraph style" aria-expanded="false" title="Paragraph style"><span id="blockLabel">Text</span><span class="down-caret" aria-hidden="true"></span></button>
      <div class="format-group" aria-label="Text style">
        <button class="icon-button" data-command="bold" data-icon="bold" title="Bold · Ctrl+B" aria-label="Bold" aria-pressed="false"></button>
        <button class="icon-button" data-command="italic" data-icon="italic" title="Italic · Ctrl+I" aria-label="Italic" aria-pressed="false"></button>
        <button class="icon-button" data-command="underline" data-icon="underline" title="Underline · Ctrl+U" aria-label="Underline" aria-pressed="false"></button>
      </div>
      <div class="format-group" aria-label="Bullet list">
        <button class="icon-button" data-command="insertUnorderedList" data-icon="list" title="Bullet list" aria-label="Bullet list"></button>
        <button class="icon-button" data-command="insertOrderedList" data-icon="list-ordered" title="Numbered list" aria-label="Numbered list"></button>
      </div>
      <button id="colorMenuButton" class="icon-button color-picker" aria-label="Text color" aria-expanded="false" title="Text color"><span data-icon="type"></span><i id="selectedColor"></i></button>
      <button id="formatMoreButton" class="icon-button" data-icon="ellipsis" aria-label="More tools" aria-expanded="false" title="More tools"></button>
    </div>
    <div id="blockMenu" class="format-popover surface" hidden dir="ltr">
      <button class="menu-item" data-block="p"><span data-icon="type"></span>Normal text</button>
      <button class="menu-item" data-block="h2"><span class="heading-icon">H</span>Heading</button>
      <button class="menu-item" data-block="blockquote"><span class="heading-icon">❞</span>Quote</button>
      <button class="menu-item" data-block="pre"><span class="heading-icon">&lt;/&gt;</span>Code</button>
    </div>
    <div id="colorMenu" class="format-popover color-popover surface" hidden dir="ltr">
      <p>Text color</p><div id="colors" class="colors" aria-label="Text color"></div>
    </div>
    <div id="formatMoreMenu" class="format-popover surface" hidden dir="ltr">
      <button class="menu-item" data-command="strikeThrough"><span data-icon="strikethrough"></span>Strikethrough</button>
      <button class="menu-item" data-command="removeFormat"><span data-icon="remove-formatting"></span>Clear formatting</button>
    </div>
    <section id="menu" class="menu surface" aria-label="Settings" hidden dir="ltr">
      <button id="themeButton" class="menu-item"><span data-icon="sun"></span><span>Light / dark</span></button>
      <div class="menu-item size-row"><span>Text size</span><button id="smallerButton" class="icon-button" aria-label="Smaller">−</button><output id="fontSize">16</output><button id="largerButton" class="icon-button" aria-label="Larger">+</button></div>
      <button id="exportButton" class="menu-item"><span data-icon="download"></span><span>Export note</span></button>
      <button id="copyButton" class="menu-item"><span data-icon="copy"></span><span>Copy complete note</span></button>
      <button id="copyTextButton" class="menu-item"><span data-icon="type"></span><span>Copy text only</span></button>
      <button id="appearanceButton" class="menu-item"><span data-icon="palette"></span><span>Appearance</span></button>
      <button id="quitButton" class="menu-item"><span data-icon="power"></span><span>Quit Jot</span></button>
      <p class="menu-hint"><bdi>Ctrl + Alt + J</bdi> Show / hide<br>Automatic Persian / English direction</p>
    </section>
    <dialog id="notesDialog" class="notes-dialog surface" aria-labelledby="notesHeading" dir="ltr">
      <div class="dialog-header"><h2 id="notesHeading">Notes</h2><button id="closeNotesButton" class="icon-button" data-icon="x" aria-label="Close"></button></div>
      <input id="search" class="search" placeholder="Search your notes…" aria-label="Search" dir="auto">
      <div id="noteList" class="note-list"></div>
      <button id="dialogNewButton" class="primary-button"><span data-icon="plus"></span>New note</button>
    </dialog>
    <input id="imageInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    <div id="error" class="error" role="alert" hidden></div>
  </main>
  <script src="design-tokens.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="renderer.js"></script>
</body>
</html>
