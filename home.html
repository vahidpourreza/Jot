<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'">
<title>Jot</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css"></head><body>
<main class="index-app" dir="ltr">
<header id="homeHandle" class="index-header"><div class="index-brand" dir="ltr"><span class="jot-logo" data-icon="jot"></span><strong>Jot</strong></div><div class="index-window-actions"><button id="settingsButton" class="icon-button" data-icon="settings-2" title="Settings" aria-label="Settings"></button><button id="homeHide" class="icon-button" data-icon="minus" title="Hide" aria-label="Hide"></button><button id="homeQuit" class="app-quit-button" type="button" title="Save notes and quit the app" aria-busy="false"><span class="quit-icon" data-icon="power"></span><span class="quit-spinner" aria-hidden="true"></span><span class="quit-idle">Quit Jot</span><span class="quit-pending">Closing…</span></button></div></header>
<div class="index-tools"><div class="home-search"><span data-icon="search"></span><input id="homeSearch" dir="auto" placeholder="Search titles, notes, or groups…" aria-label="Search"></div><button id="homeNew" class="primary-button"><span data-icon="plus"></span><span>New note</span></button><span id="noteCount"></span></div>
<div class="group-bar"><span class="group-label">Groups</span><nav id="groupFilters" class="group-filters" aria-label="Note groups"></nav></div>
<section class="index-board"><div id="cards" class="note-cards"></div><div id="homeEmpty" class="home-empty" hidden><span data-icon="jot"></span><h2>Keep that thought</h2><p>Create a note and keep its small window beside your work.</p><button id="emptyNew" class="primary-button">Create your first note</button></div></section>
<footer class="home-footer"><span id="homeStatus">Saved locally · on this device</span><span dir="ltr">Ctrl + Alt + J</span></footer>
<dialog id="metadataDialog" class="metadata-dialog surface" dir="ltr" aria-labelledby="metadataTitle"><header><h2 id="metadataTitle">Note details</h2><button id="metadataClose" class="icon-button" data-icon="x" aria-label="Close"></button></header>
<form id="metadataForm"><label for="noteTitleInput">Title</label><input id="noteTitleInput" maxlength="140" dir="auto" placeholder="Leave empty to use the first line"><label for="noteGroupInput">Group</label><input id="noteGroupInput" maxlength="64" dir="auto" placeholder="For example: Work, Ideas, or Personal"><div id="groupSuggestions" class="group-suggestions"></div><p>Enter a new group name or choose an existing group.</p><button id="metadataSave" class="primary-button" type="submit">Save</button></form></dialog>
<p id="homeError" class="error" hidden role="alert"></p></main><script src="design-tokens.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="home.js"></script></body></html>
