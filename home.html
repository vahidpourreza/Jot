<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'">
<title>Jot</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="library.css"><link rel="stylesheet" href="notifications.css"></head><body>
<main class="index-app library-app" dir="ltr">
<header id="homeHandle" class="index-header workspace-header"><div id="homeTabs" class="workspace-tabs"></div><div class="index-window-actions"><button id="homeMinimize" class="icon-button" data-icon="window-minimize" title="Minimize" aria-label="Minimize"></button><button id="homeFullscreen" class="icon-button" data-icon="window-maximize" title="Maximize" aria-label="Maximize" aria-pressed="false"></button><button id="homeClose" class="icon-button window-close-button" data-icon="window-close" title="Close window" aria-label="Close window"></button></div></header>
<div class="library-shell">
<aside id="librarySidebar" class="library-sidebar" aria-label="Library folders"><div class="library-sidebar-heading">Library</div><nav id="sidebarChoices" aria-label="Browse notes"></nav><div class="library-sidebar-footer">Keep notes together with folders.</div></aside>
<section class="library-content" aria-label="Note library">
<nav class="library-appbar" aria-label="Library actions"><button id="folderButton" class="library-folder-button" aria-label="Browse folders" aria-controls="folderPanel" aria-haspopup="true" aria-expanded="false"><span data-icon="folder"></span><span>Folders</span><span data-icon="chevron-down"></span></button><button id="homeNew" class="library-new" title="New note" aria-label="New note" aria-busy="false"><span data-icon="plus"></span><span>New note</span></button><div class="library-appbar-spacer"></div><button id="selectNotes" class="library-secondary" aria-pressed="false">Select</button><button id="settingsButton" class="icon-button" data-icon="settings" title="Settings" aria-label="Settings"></button></nav>
<div class="library-search-row"><label class="home-search" for="homeSearch"><span data-icon="search"></span><input id="homeSearch" type="search" placeholder="Search notes" aria-label="Search notes" dir="auto" autocomplete="off"><button id="clearSearch" class="icon-button" data-icon="x" title="Clear search" aria-label="Clear search" hidden></button></label></div>
<div class="library-section-heading"><div class="library-section-title"><h1 id="folderLabel" dir="auto">All notes</h1><output id="noteCount" aria-live="polite"></output></div><div class="library-view" role="group" aria-label="Note layout"><button id="gridView" class="icon-button" data-icon="layout-grid" title="Grid view" aria-label="Grid view" aria-pressed="true"></button><button id="listView" class="icon-button" data-icon="list" title="List view" aria-label="List view" aria-pressed="false"></button></div></div>
<div id="bulkActions" class="library-bulk" aria-label="Selected note actions" hidden><label class="library-select-all"><input id="selectAllNotes" type="checkbox" aria-label="Select all visible notes"><span id="selectionCount">0 selected</span></label><div class="library-bulk-buttons"><button id="bulkPin" class="library-secondary" aria-busy="false"><span data-icon="pin"></span><span>Pin</span></button><button id="bulkMove" class="library-secondary"><span data-icon="folder"></span><span>Move</span></button><button id="bulkDelete" class="library-danger"><span data-icon="trash-2"></span><span>Delete</span></button></div></div>
<section class="index-board" aria-label="Notes"><div id="cards" class="note-cards" data-view="grid"></div><div id="homeEmpty" class="home-empty" hidden><span class="library-empty-icon" data-icon="notepad-text"></span><h2 id="emptyTitle">No notes yet</h2><p id="emptyDescription">Create a note to get started.</p><button id="emptyNew" class="primary-button" aria-busy="false">New note</button></div></section>
</section></div>
<div id="folderPanel" class="library-folder-panel surface" role="region" aria-label="Folders" hidden><div class="library-panel-heading">Browse notes<button id="closeFolders" class="icon-button" data-icon="x" aria-label="Close folders" title="Close folders"></button></div><div id="folderChoices"></div><button id="newFolder" class="library-folder-create"><span data-icon="folder-plus"></span>New folder</button></div>
<dialog id="metadataDialog" class="metadata-dialog surface" dir="ltr" aria-labelledby="metadataTitle"><header><h2 id="metadataTitle">Rename note</h2><button id="metadataClose" class="icon-button" data-icon="x" title="Close" aria-label="Close"></button></header><form id="metadataForm"><label id="metadataLabel" for="noteTitleInput">Title</label><input id="noteTitleInput" maxlength="140" dir="auto" placeholder="Optional title"><p class="dialog-error" role="alert" hidden></p><button id="metadataSave" class="primary-button" type="submit" aria-busy="false">Save</button></form></dialog>
<dialog id="moveDialog" class="metadata-dialog surface" aria-labelledby="moveTitle"><header><h2 id="moveTitle">Move to folder</h2><button id="moveClose" class="icon-button" data-icon="x" title="Close" aria-label="Close"></button></header><div id="moveFolders" class="move-folder-list"></div><p class="dialog-error" role="alert" hidden></p></dialog>
<dialog id="libraryConfirm" class="metadata-dialog surface" aria-labelledby="confirmTitle"><header><h2 id="confirmTitle">Delete note?</h2></header><p id="confirmDescription"></p><p class="dialog-error" role="alert" hidden></p><div class="library-dialog-actions"><button id="confirmCancel" class="library-secondary">Cancel</button><button id="confirmApply" class="library-danger" aria-busy="false">Delete</button></div></dialog>
<p id="homeError" class="error" hidden role="alert"></p></main><script src="design-tokens.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="notifications.js"></script><script src="shortcut-bindings.js"></script><script src="context-menus.js"></script><script src="bidi.js"></script><script src="assets/emoji/emoji-data.js"></script><script src="note-personalization.js"></script><script src="workspace-tabs.js"></script><script src="home.js"></script></body></html>
