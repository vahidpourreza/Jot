<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'">
<title>Jot</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css"></head><body>
<main class="index-app" dir="ltr">
<header id="homeHandle" class="index-header"><div class="index-brand"><button id="homeNew" class="icon-button" data-icon="plus" title="New note" aria-label="New note" aria-busy="false"></button><span>Home</span></div><div class="index-window-actions"><button id="settingsButton" class="icon-button" data-icon="settings" title="Settings" aria-label="Settings"></button><button id="homeMinimize" class="icon-button" data-icon="minus" title="Minimize" aria-label="Minimize"></button><button id="homeClose" class="icon-button" data-icon="x" title="Close to tray" aria-label="Close to tray"></button></div></header>
<section class="index-board" aria-label="Notes"><div id="cards" class="note-cards"></div><div id="homeEmpty" class="home-empty" hidden><span data-icon="notepad-text"></span><h2>No notes yet</h2><button id="emptyNew" class="primary-button" aria-busy="false">New note</button></div></section>
<dialog id="metadataDialog" class="metadata-dialog surface" dir="ltr" aria-labelledby="metadataTitle"><header><h2 id="metadataTitle">Rename note</h2><button id="metadataClose" class="icon-button" data-icon="x" title="Close" aria-label="Close"></button></header>
<form id="metadataForm"><label for="noteTitleInput">Title</label><input id="noteTitleInput" maxlength="140" dir="auto" placeholder="Leave empty to use the first line"><button id="metadataSave" class="primary-button" type="submit" aria-busy="false">Save</button></form></dialog>
<p id="homeError" class="error" hidden role="alert"></p></main><script src="design-tokens.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="context-menus.js"></script><script src="bidi.js"></script><script src="home.js"></script></body></html>
