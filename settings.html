<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'"><title>Jot · Settings</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css"></head><body><main class="settings-app" dir="ltr">
<header id="settingsHandle" class="index-header"><div class="index-brand"><button id="settingsBack" class="icon-button" data-icon="chevron-left" title="Back to Home" aria-label="Back to Home"></button><span>Settings</span></div><div class="index-window-actions"><button id="settingsMinimize" class="icon-button" data-icon="minus" title="Minimize" aria-label="Minimize"></button><button id="settingsClose" class="icon-button" data-icon="x" title="Close to tray" aria-label="Close to tray"></button></div></header>
<section id="appearance" class="appearance"><div class="settings-card"><div class="settings-row"><div><h2>Theme</h2><p>Light or dark across all of Jot.</p></div><div class="segmented" role="group" aria-label="App theme"><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button></div></div></div></section>
<footer class="home-footer"><span id="homeStatus" role="status"></span><button id="settingsQuit" class="app-quit-button" type="button" title="Save notes and quit the app" aria-busy="false"><span class="quit-icon" data-icon="power"></span><span class="quit-spinner" aria-hidden="true"></span><span class="quit-idle">Quit Jot</span><span class="quit-pending">Closing…</span></button></footer><p id="homeError" class="error" hidden role="alert"></p>
</main><script src="design-tokens.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="context-menus.js"></script><script src="settings.js"></script></body></html>
