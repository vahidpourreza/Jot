<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; object-src 'none'"><title>Jot · Settings</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="workspace.css"><link rel="stylesheet" href="writing-settings.css"><link rel="stylesheet" href="shortcuts.css"><link rel="stylesheet" href="notifications.css"></head><body><main class="settings-app" dir="ltr">
<header id="settingsHandle" class="index-header workspace-header"><div id="settingsTabs" class="workspace-tabs"></div><div class="index-window-actions"><button id="settingsMinimize" class="icon-button" data-icon="window-minimize" title="Minimize" aria-label="Minimize"></button><button id="settingsFullscreen" class="icon-button" data-icon="window-maximize" title="Maximize" aria-label="Maximize" aria-pressed="false"></button><button id="settingsClose" class="icon-button window-close-button" data-icon="window-close" title="Close window" aria-label="Close window"></button></div></header>
<div class="settings-page-heading"><button id="settingsBack" class="icon-button" data-icon="chevron-left" title="Back to Home" aria-label="Back to Home"></button><h1 id="settingsPageTitle">Settings</h1></div>
<section id="appearance" class="appearance compact-settings">
  <div class="settings-card"><div class="settings-row"><div><h2>Theme</h2><p>Across all of Jot.</p></div><div class="segmented" role="group" aria-label="App theme"><button data-theme-choice="light">Light</button><button data-theme-choice="dark">Dark</button></div></div><div class="settings-row new-note-target-row"><div><h2 id="newNoteTargetLabel">Open mode</h2></div><div id="newNoteTarget" class="segmented" role="group" aria-labelledby="newNoteTargetLabel" aria-description="Changing the mode also moves open notes."><button type="button" data-new-note-target="tab" aria-pressed="true">Tabs</button><button type="button" data-new-note-target="window" aria-pressed="false">Separate windows</button></div></div><div class="settings-row"><div><h2 id="autoSaveFilesLabel">Auto-save files</h2><p id="autoSaveFilesHint">Update linked files after 1 second idle.</p></div><button id="autoSaveFiles" class="settings-toggle" type="button" role="switch" aria-checked="false" aria-labelledby="autoSaveFilesLabel" aria-describedby="autoSaveFilesHint"><span class="settings-toggle-knob"></span><span class="settings-toggle-pending" aria-hidden="true"></span></button></div></div>
  <section class="writing-defaults" aria-labelledby="writingDefaultsHeading"><div class="writing-defaults-heading"><h2 id="writingDefaultsHeading">Writing defaults</h2><p>For new notes and notes using defaults.</p></div><div class="settings-card">
    <div class="settings-row"><label id="settingsFontSizeLabel">Font size</label><div class="writing-stepper settings-writing-stepper" role="group" aria-labelledby="settingsFontSizeLabel"><button id="settingsFontSmaller" type="button" class="icon-button" aria-label="Decrease default font size">−</button><output id="settingsFontSize">16 px</output><button id="settingsFontLarger" type="button" class="icon-button" aria-label="Increase default font size">+</button></div></div>
    <div class="settings-row"><label for="settingsLineHeight">Line height</label><select id="settingsLineHeight" aria-label="Default line height"><option value="1.2">1.2×</option><option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="1.95">1.95×</option><option value="2.2">2.2×</option><option value="2.5">2.5×</option></select></div>
  </div></section>
  <button id="settingsShortcuts" class="settings-shortcuts-link" type="button"><span>Keyboard shortcuts</span><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2"></rect><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M6 12h.01M10 12h.01M14 12h.01M18 12h.01M7 15h10"></path></svg><svg class="lucide" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
</section>
<footer class="home-footer"><span id="homeStatus" role="status"></span><button id="settingsQuit" class="app-quit-button" type="button" title="Save notes and quit the app" aria-busy="false"><span class="quit-icon" data-icon="power"></span><span class="quit-spinner" aria-hidden="true"></span><span class="quit-idle">Quit Jot</span><span class="quit-pending">Closing…</span></button></footer><p id="homeError" class="error" hidden role="alert"></p>
</main><script src="design-tokens.js"></script><script src="i18n.js"></script><script src="shared.js"></script><script src="notifications.js"></script><script src="shortcut-bindings.js"></script><script src="context-menus.js"></script><script src="workspace-tabs.js"></script><script src="shortcuts.js"></script><script src="settings.js"></script><script src="app-shortcuts.js"></script></body></html>
